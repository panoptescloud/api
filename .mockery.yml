all: false
dir: '{{.InterfaceDir}}'
filename: "{{ .InterfaceName | snakecase }}.go"
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: 'Mock{{ .InterfaceName | firstUpper }}'
pkgname: '{{.SrcPackageName}}_mocks'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
    github.com/panoptescloud/api/internal/api/http/v1beta:
        config:
            dir: 'tests/mocks/gen/api/http/v1beta'
        interfaces:
            # select the interfaces you want mocked
            sessionManager:
            githubOauthClient:
    github.com/panoptescloud/api/internal/api/http:
        config:
            dir: 'tests/mocks/gen/api/http'
        interfaces:
            # select the interfaces you want mocked
            sessionManager:
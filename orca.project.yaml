composeFiles:
  primary: docker-compose.yml

tlsCerts:
  - 'panoptes.test'

envFiles:
- path: .dockerenv

hosts:
  - panoptes.test
  - api-docs.panoptes.test

extensions:
- name: "go:fmt"
  service: "app"
  command: "go fmt"
  defaultArgs: [ "./..." ]

- name: "go:test"
  service: "app"
  command: "./scripts/test.sh"
  defaultArgs: [ "./..." ]
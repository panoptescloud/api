composeFiles:
  primary: docker-compose.yml

tlsCerts:
  - 'panoptes.test'

envFiles:
- path: .dockerenv

hosts:
  - panoptes.test
  - api-docs.panoptes.test
  - pgadmin.panoptes.test

extensions:
- name: "go:fmt"
  service: "app"
  command: "go fmt"
  defaultArgs: [ "./..." ]

- name: "go:mod:tidy"
  service: "app"
  command: "go mod tidy"

# Follow this up with a go:mod:tidy
- name: "go:mod:update"
  service: "app"
  command: "go get -u ./..."

# Unit tests
- name: "go:test"
  service: "app"
  command: "./scripts/test.sh"
  defaultArgs: [ "./..." ]

# - name: "go:test:int"
#   service: "app"
#   command: "./scripts/test.sh"
#   defaultArgs: [ "-tags=integration", "./..." ]

# - name: "go:test:feat"
#   service: "app"
#   command: "./scripts/test.sh"
#   defaultArgs: [ "-tags=feature", "./..." ]

- name: "mocks:gen"
  service: "app"
  command: "mockery"

- name: "migrate:up"
  service: "migrate"
  command: "up"

- name: "migrate:down"
  service: "migrate"
  command: "down"

- name: "migrate:wipe"
  service: "migrate"
  command: "drop"

- name: "migrate:force"
  service: "migrate"
  command: "force"

- name: "sqlc"
  service: "app"
  command: "sqlc"
  defaultArgs:
    - generate

- name: "jwt:gen-keys"
  service: "jwt-keygen"
  command: "/gen_rsa.sh"

- name: "jwt:gen-random-secret"
  service: "jwt-keygen"
  command: "/gen_secret_key.sh"

- name: "trivy:scan:fs"
  service: "trivy-scan"
  command: "fs"
  defaultArgs:
    - "."

# Delete any docker containers created by testcontainers. Sometimes panics can 
# leave things hanging. 
# TODO: Sort out extensions so they can run on the host.
# docker ps -a -q --filter "label=org.testcontainers=true" | xargs -r docker rm -f

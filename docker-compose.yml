services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      AIR_DEBUG: ${AIR_DEBUG:-false}
      # See: https://github.com/testcontainers/testcontainers-go/issues/2477#issuecomment-2417815745
      TESTCONTAINERS_RYUK_DISABLED: true
      TEST_MIGRATIONS_PATH: "/app/etc/postgres/migrations"
      # See .local/docker/watch.sh
      # This is the subcommand of the binary we wanna run
      APP_CMD: serve
      POSTGRES_DSN: postgres://${PANOPTES_POSTGRES_MIGRATOR_USER}:${PANOPTES_POSTGRES_MIGRATOR_PASSWORD}@postgres:${PANOPTES_POSTGRES_PORT}/${PANOPTES_POSTGRES_DB}?search_path=${PANOPTES_POSTGRES_SCHEMA}&sslmode=disable
      PANOPTES_DB_POSTGRES_USERNAME: ${PANOPTES_POSTGRES_APP_USER}
      PANOPTES_DB_POSTGRES_HOST: postgres
      PANOPTES_DB_POSTGRES_PASSWORD: ${PANOPTES_POSTGRES_APP_PASSWORD}
      PANOPTES_DB_POSTGRES_DBNAME: ${PANOPTES_POSTGRES_DB}
      PANOPTES_DB_POSTGRES_SSLMODE: 'disable'
    working_dir: /app
    volumes:
      - ".:/app"
      # So we can use testcontainers
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
        - "traefik.http.routers.api.rule=Host(`${API_HOST}`) && PathPrefix(`/api`)"
        - "traefik.enable=true"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.services.api.loadbalancer.server.port=8080"
        - "traefik.http.routers.api.tls=true"

  postgres:
    image: timescale/timescaledb-ha:pg17
    command: postgres -c shared_preload_libraries=timescaledb
    ports:
      # Allow users to connect from their host for development
      - "${PANOPTES_POSTGRES_HOST_PORT}:${PANOPTES_POSTGRES_PORT}"
    environment:
      PGDATA: /home/postgres/pgdata/data
      POSTGRES_PASSWORD: ${PANOPTES_POSTGRES_ROOT_PASSWORD}
      POSTGRES_USER: ${PANOPTES_POSTGRES_ROOT_USER}
      POSTGRES_DB: ${PANOPTES_POSTGRES_DB}
      PANOPTES_POSTGRES_SCHEMA: ${PANOPTES_POSTGRES_SCHEMA}
      PANOPTES_POSTGRES_APP_USER: ${PANOPTES_POSTGRES_APP_USER}
      PANOPTES_POSTGRES_APP_PASSWORD: ${PANOPTES_POSTGRES_APP_PASSWORD}
      PANOPTES_POSTGRES_MIGRATOR_USER: ${PANOPTES_POSTGRES_MIGRATOR_USER}
      PANOPTES_POSTGRES_MIGRATOR_PASSWORD: ${PANOPTES_POSTGRES_MIGRATOR_PASSWORD}
    volumes:
      - postgres:/home/postgres/pgdata/data
      - ${PANOPTES_POSTGRES_INIT_DIR}/1000_setup.sh:/docker-entrypoint-initdb.d/1000_setup.sh

  pgadmin:
    image: dpage/pgadmin4:8.12
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PANOPTES_PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PANOPTES_PGADMIN_PASSWORD}
      # Disable login and security precautions; useful in dev
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: 'False'
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['test']"
    volumes:
      - "${PANOPTES_PGADMIN_SERVERS_FILEPATH}:/pgadmin4/servers.json"
    labels:
      - "traefik.http.routers.api-pgadmin.rule=Host(`${PANOPTES_PGADMIN_HOST}`)"
      - "traefik.enable=true"
      - "traefik.http.routers.api-pgadmin.entrypoints=websecure"
      - "traefik.http.services.api-pgadmin.loadbalancer.server.port=${PANOPTES_PGADMIN_PORT}"
      - "traefik.http.routers.api-pgadmin.tls=true"

  migrate:
    profiles:
      - manual
    image: migrate/migrate:4
    environment:
      POSTGRES_URL: postgres://${PANOPTES_POSTGRES_MIGRATOR_USER}:${PANOPTES_POSTGRES_MIGRATOR_PASSWORD}@postgres:${PANOPTES_POSTGRES_PORT}/${PANOPTES_POSTGRES_DB}?search_path=${PANOPTES_POSTGRES_SCHEMA}&sslmode=disable
    volumes:
      - ${PANOPTES_MIGRATIONS_DIR}:/migrations
      - ${PANOPTES_DB_MIGRATE_SCRIPT}:/scripts/migrate.sh
    entrypoint: /scripts/migrate.sh

  mkdocs:
    build:
      context: .
      dockerfile: ./etc/mkdocs/Dockerfile
    volumes:
      - .:/docs
    labels:
      - "traefik.http.routers.api-mkdocs.rule=Host(`${DOCS_HOST}`)"
      - "traefik.enable=true"
      - "traefik.http.routers.api-mkdocs.entrypoints=websecure"
      - "traefik.http.services.api-mkdocs.loadbalancer.server.port=8000"
      - "traefik.http.routers.api-mkdocs.tls=true"

  jwt-keygen:
    profiles:
      - manual
    image: alpine/openssl:3.5.4
    volumes:
      - ./scripts/gen_rsa.sh:/gen_rsa.sh
      - ./scripts/gen_secret_key.sh:/gen_secret_key.sh
      - ./scripts/generic_entrypoint.sh:/generic_entrypoint.sh
      - ./.local/jwt/keys:/target
    entrypoint: /generic_entrypoint.sh
    working_dir: /target

  trivy-scan:
    profiles:
      - manual
    image: aquasec/trivy
    volumes: 
      - .:/src
    working_dir: /src

volumes:
  # Persistent storage for postgres
  postgres:
